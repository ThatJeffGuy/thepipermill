# Copy to ~/.config/voice-studio/config.toml (or point VOICESTUDIO_CONFIG at it). Every line is optional.

home = "~/voice-studio-data"        # recordings, prepared clips, checkpoints and finished voices live here
host = "127.0.0.1"                  # keep on localhost: the page has no login
port = 8765
espeak_voice = "en-us"              # language of your recordings (espeak-ng voice name; the base voices are English)
audio_language = ""                  # videos with several audio tracks: prefer this language (e.g. "eng"); default = the first track
whisper_model = "openai/whisper-large-v3-turbo"   # writes down what you said; try "openai/whisper-small" on small GPUs
val_every = 10                      # check quality + save a checkpoint every N rounds: larger is faster (about 30% at 5), 1 = every round
train_precision = ""                 # "" = Piper default (full precision). "bf16-mixed" can train faster; compare the result by ear
whisper_beams = 5                   # Prepare: transcription search width (1 = much faster, 5 = slightly more accurate)
batch_size = 0                      # 0 = automatic from GPU memory (8 GB -> 8, 12-16 GB -> 16)
hf_token = ""                       # only needed for "Who is speaking?" (see README); or set HF_TOKEN / run `hf auth login`
speaker_match_distance = 0.55       # lower = stricter about calling two voices the same person
protected_names = []                # voice names that can never be created

# Tell another service when a job finishes (even if no browser is open): a Home Assistant webhook, an ntfy topic, ...
notify_url = ""                     # e.g. "http://homeassistant.local:8123/api/webhook/piper-mill"  (keep it private: it may contain a secret)
notify_format = "json"              # json | text   (text = just the message, handy for ntfy)
